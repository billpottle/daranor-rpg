name: Bug report
description: Report a reproducible problem in a Daranor RPG game or launcher.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Daranor RPG. Please provide enough detail for someone else to reproduce the problem. Attach saves or screenshots only if you are comfortable sharing them publicly.

  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Where did the problem occur?
      options:
        - DreamQuest
        - ProphecyQuest / SwordQuest
        - Launcher or both games
    validations:
      required: true

  - type: dropdown
    id: delivery
    attributes:
      label: How were you playing?
      options:
        - Official website
        - Downloaded offline build
        - Local development build
        - Other hosted copy
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Build, commit, or URL
      description: Paste the website URL, release name, or Git commit when available.
      placeholder: https://example.com/games/dreamquest/ or commit abc1234

  - type: input
    id: environment
    attributes:
      label: Browser, OS, and device
      description: Include browser version and whether this is desktop, phone, or tablet.
      placeholder: Chrome 128, Android 15, Pixel 8
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and any visible error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from a known screen or save and list the actions in order.
      placeholder: |
        1. Start or load ...
        2. Travel to ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Save file, screenshots, or console output
      description: Drag files here. Saves reveal game progress; review anything you attach because GitHub issues are public.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I can reproduce this on the build or URL listed above.
          required: true
        - label: I have permission to share any attached files.
          required: false
